<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feedback – Wie war dein Tag?</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2330; --muted: #5b6475;
    --accent: #2563eb; --accent-text: #ffffff; --border: #d8dde5;
    --sel: #e8f0ff; --error-bg: #fdecec; --error: #b42318; --info-bg: #eef6ee; --info: #22543d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1c212b; --text: #e8ebf1; --muted: #a2abbb;
      --accent: #5b8def; --accent-text: #0b1020; --border: #343b49;
      --sel: #253457; --error-bg: #3a1d1d; --error: #ffb4ab; --info-bg: #1d3326; --info: #b7e4c7;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 8px 0 12px; }
  .note {
    background: var(--info-bg); color: var(--info); border-radius: 12px;
    padding: 12px 14px; font-size: .95rem; margin-bottom: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 16px; margin-bottom: 16px;
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, label.q { font-weight: 600; font-size: 1.1rem; display: block; margin-bottom: 12px; padding: 0; }
  .opt { color: var(--muted); font-weight: 400; font-size: .9rem; }
  .req { color: var(--error); }
  .moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .moods input { position: absolute; opacity: 0; pointer-events: none; }
  .moods label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 84px; border: 2px solid var(--border); border-radius: 14px;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .moods .emoji { font-size: 2.1rem; line-height: 1.1; }
  .moods .lbl { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .moods input:checked + label { border-color: var(--accent); background: var(--sel); transform: scale(1.04); }
  .moods input:checked + label .lbl { color: var(--text); font-weight: 600; }
  .moods input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; font: inherit; font-size: 16px;
    color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .counter { text-align: right; font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .hint { font-size: .9rem; color: var(--muted); margin: 0 4px 16px; }
  button {
    width: 100%; min-height: 56px; border: 0; border-radius: 14px; font: inherit;
    font-size: 1.1rem; font-weight: 600; background: var(--accent); color: var(--accent-text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .error {
    display: none; background: var(--error-bg); color: var(--error);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .error.show { display: block; }
  #thanks { display: none; text-align: center; padding-top: 48px; }
  #thanks .big { font-size: 4rem; }
  #thanks p { color: var(--muted); margin-bottom: 28px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main>
  <section id="survey">
    <h1>Wie war dein Tag?</h1>
    <div class="note">🔒 Diese Umfrage ist <strong>anonym</strong>. Wir fragen weder nach deinem Namen noch nach deiner Personalnummer.</div>

    <form id="form" novalidate>
      <div class="card">
        <fieldset>
          <legend>Wie war dein Tag heute? <span class="req" aria-hidden="true">*</span></legend>
          <div class="moods" role="radiogroup">
            <input type="radio" name="bewertung" id="m1" value="1"><label for="m1"><span class="emoji" aria-hidden="true">😞</span><span class="lbl">Schlecht</span></label>
            <input type="radio" name="bewertung" id="m2" value="2"><label for="m2"><span class="emoji" aria-hidden="true">🙁</span><span class="lbl">Mäßig</span></label>
            <input type="radio" name="bewertung" id="m3" value="3"><label for="m3"><span class="emoji" aria-hidden="true">😐</span><span class="lbl">Okay</span></label>
            <input type="radio" name="bewertung" id="m4" value="4"><label for="m4"><span class="emoji" aria-hidden="true">🙂</span><span class="lbl">Gut</span></label>
            <input type="radio" name="bewertung" id="m5" value="5"><label for="m5"><span class="emoji" aria-hidden="true">😄</span><span class="lbl">Super</span></label>
          </div>
        </fieldset>
      </div>

      <div class="card">
        <label class="q" for="gut">Was lief gut? <span class="opt">(optional)</span></label>
        <textarea id="gut" name="gut" maxlength="1000" placeholder="Was hat dir heute gefallen?"></textarea>
        <div class="counter"><span data-for="gut">0</span>/1000</div>
      </div>

      <div class="card">
        <label class="q" for="schlecht">Was lief nicht gut? <span class="opt">(optional)</span></label>
        <textarea id="schlecht" name="schlecht" maxlength="1000" placeholder="Was können wir besser machen?"></textarea>
        <div class="counter"><span data-for="schlecht">0</span>/1000</div>
      </div>

      <!-- Honeypot gegen Bots, für Menschen unsichtbar -->
      <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>

      <p class="hint">⚠️ Bitte nenne keine Namen von Kolleginnen und Kollegen.</p>
      <div id="error" class="error" role="alert"></div>
      <button type="submit" id="submit">Absenden</button>
    </form>
  </section>

  <section id="thanks" aria-live="polite">
    <div class="big">🙏</div>
    <h1>Danke für dein Feedback!</h1>
    <p>Deine Antwort wurde anonym übermittelt.</p>
    <button type="button" id="again">Noch eine Antwort abgeben</button>
  </section>
</main>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/HIER_DEINE_DEPLOYMENT_ID/exec";

  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submit");
  const errorBox = document.getElementById("error");
  const survey = document.getElementById("survey");
  const thanks = document.getElementById("thanks");

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add("show"); }
  function clearError() { errorBox.textContent = ""; errorBox.classList.remove("show"); }

  document.querySelectorAll("textarea").forEach(function (ta) {
    const counter = document.querySelector('[data-for="' + ta.id + '"]');
    ta.addEventListener("input", function () { counter.textContent = ta.value.length; });
  });
  form.addEventListener("change", function (e) { if (e.target.name === "bewertung") clearError(); });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    clearError();
    const selected = form.querySelector('input[name="bewertung"]:checked');
    if (!selected) { showError("Bitte wähle aus, wie dein Tag heute war."); return; }
    if (form.website.value) { done(); return; } // Bot

    const body = new URLSearchParams({
      bewertung: selected.value,
      gut: form.gut.value.trim().slice(0, 1000),
      schlecht: form.schlecht.value.trim().slice(0, 1000)
    });

    submitBtn.disabled = true;
    submitBtn.textContent = "Wird gesendet …";
    try {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: body });
      done();
    } catch (err) {
      showError("Senden fehlgeschlagen. Bitte prüfe deine Internetverbindung und versuche es erneut.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Absenden";
    }
  });

  function done() {
    form.reset();
    document.querySelectorAll(".counter span").forEach(function (s) { s.textContent = "0"; });
    survey.style.display = "none";
    thanks.style.display = "block";
    window.scrollTo(0, 0);
  }

  document.getElementById("again").addEventListener("click", function () {
    thanks.style.display = "none";
    survey.style.display = "block";
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
